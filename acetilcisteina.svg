<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-acet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="caja-acet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="sombras-acet" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg-acet)"/>
  <circle cx="340" cy="70" r="90" fill="#94a3b8" opacity="0.2"/>
  <circle cx="70" cy="230" r="100" fill="#475569" opacity="0.12"/>

  <!-- Caja de Acetilcisteína -->
  <g filter="url(#sombras-acet)">
    <rect x="50" y="65" width="200" height="155" rx="10" fill="url(#caja-acet)" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 50 75 Q 50 65 60 65 L 240 65 Q 250 65 250 75 L 250 105 L 50 105 Z" fill="#0891b2"/>
    <text x="70" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">FARMACIA CONDORI</text>

    <text x="70" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#0f172a">ACETILCISTEÍNA</text>
    <text x="70" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0891b2">600 mg • Efervescente</text>
    <text x="70" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Fluidificante de mucosidad y flema</text>

    <rect x="70" y="202" width="85" height="12" rx="3" fill="#cffafe"/>
    <text x="75" y="211" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#0e7490">20 SOBRES</text>
  </g>

  <!-- Sobres efervescentes y vaso de agua burbujeante -->
  <g filter="url(#sombras-acet)">
    <!-- Sobre 1 inclinado -->
    <g transform="translate(250, 110) rotate(-10)">
      <rect x="0" y="0" width="70" height="95" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="0" y="0" width="70" height="18" fill="#0891b2" rx="5"/>
      <text x="5" y="12" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="bold" fill="#ffffff">ACETILCISTEÍNA</text>
      <text x="12" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">600</text>
      <text x="12" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">mg</text>
      <circle cx="35" cy="78" r="8" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
    </g>

    <!-- Vaso con burbujas -->
    <path d="M 315 150 L 355 150 L 348 225 L 322 225 Z" fill="#e0f2fe" opacity="0.85" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="335" cy="165" rx="12" ry="4" fill="#38bdf8" opacity="0.4"/>
    <!-- Burbujitas de efervescencia -->
    <circle cx="330" cy="180" r="3" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="340" cy="190" r="2.5" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="333" cy="205" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="338" cy="215" r="2" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
  </g>
</svg>
