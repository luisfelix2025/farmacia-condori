<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente para la cruz médica -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2CB" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1a4a7a" />
    </linearGradient>

    <!-- Gradiente para la hoja medicinal -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Sombra suave para dar volumen -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1a4a7a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Contenedor / Escudo blanco con borde turquesa -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#ffffff" stroke="#40E0D0" stroke-width="2.5" filter="url(#logoShadow)" />

  <!-- Cruz médica de farmacia -->
  <path d="M 40 18 C 40 16 60 16 60 18 L 60 38 L 80 38 C 82 38 82 58 80 58 L 60 58 L 60 78 C 60 80 40 80 40 78 L 40 58 L 20 58 C 18 58 18 38 20 38 L 40 38 Z"
        fill="url(#crossGrad)" />

  <!-- Brillo blanco interior de la cruz -->
  <path d="M 43 22 L 57 22 L 57 41 L 76 41 L 76 55 L 57 55 L 57 74 L 43 74 L 43 55 L 24 55 L 24 41 L 43 41 Z"
        fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35" />

  <!-- Mortero de boticario (farmacia) en blanco y turquesa -->
  <!-- Tazón del mortero -->
  <path d="M 35 52 C 35 69 65 69 65 52 Z" fill="#ffffff" />
  <ellipse cx="50" cy="52" rx="15" ry="3.2" fill="#e0f2fe" stroke="#1a4a7a" stroke-width="0.8" />

  <!-- Mano / Pistilo del mortero -->
  <path d="M 37 34 L 47 51 L 52 49 L 41 32 C 39 29 35 31 37 34 Z" fill="#1a4a7a" />

  <!-- Hoja medicinal (salud y bienestar natural) -->
  <path d="M 50 49 C 63 40 68 28 68 28 C 68 28 69 45 53 50 Z" fill="url(#leafGrad)" />
  <path d="M 51 48 Q 60 38 67 29" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" />
</svg>
