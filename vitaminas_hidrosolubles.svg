<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-hidro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="caja-hidro" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <linearGradient id="tubo-vitc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="sombras-hidro" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg-hidro)"/>
  <circle cx="340" cy="70" r="90" fill="#fca5a5" opacity="0.2"/>
  <circle cx="70" cy="230" r="100" fill="#e11d48" opacity="0.12"/>

  <!-- Caja de Vitaminas Hidrosolubles -->
  <g filter="url(#sombras-hidro)">
    <rect x="45" y="65" width="215" height="155" rx="10" fill="url(#caja-hidro)" stroke="#fecdd3" stroke-width="2"/>
    <path d="M 45 75 Q 45 65 55 65 L 250 65 Q 260 65 260 75 L 260 105 L 45 105 Z" fill="#e11d48"/>
    <text x="65" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">FARMACIA CONDORI</text>

    <text x="65" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#0f172a">VITAMINAS</text>
    <text x="65" y="162" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#e11d48">Hidrosolubles (C + Complejo B)</text>
    <text x="65" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Energía diaria y sistema inmunológico</text>

    <rect x="65" y="200" width="90" height="14" rx="3" fill="#ffe4e6"/>
    <text x="70" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#be123c">COMPLEJO B + C</text>
  </g>

  <!-- Tubo cilíndrico de comprimidos efervescentes -->
  <g filter="url(#sombras-hidro)">
    <!-- Tubo -->
    <rect x="270" y="90" width="45" height="140" rx="8" fill="url(#tubo-vitc)" stroke="#c2410c" stroke-width="1.5"/>
    <!-- Tapa del tubo con resorte -->
    <rect x="266" y="80" width="53" height="15" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Etiqueta del tubo -->
    <text x="278" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">VIT-C</text>
    <text x="278" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#fef08a">1000 mg</text>

    <!-- Pastilla efervescente naranja redonda afuera -->
    <circle cx="335" cy="195" r="18" fill="#fdba74" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="335" cy="195" r="14" fill="#fed7aa"/>
    <text x="328" y="199" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#c2410c">C</text>

    <!-- Rodaja de cítrico decorativa pequeña -->
    <circle cx="340" cy="140" r="14" fill="#f97316"/>
    <circle cx="340" cy="140" r="11" fill="#fed7aa"/>
    <line x1="329" y1="140" x2="351" y2="140" stroke="#f97316" stroke-width="1.5"/>
    <line x1="340" y1="129" x2="340" y2="151" stroke="#f97316" stroke-width="1.5"/>
  </g>
</svg>
