<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-diclofenaco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="caja-d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="tubo-gel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="sombras-d" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fondo clínico anaranjado suave para dolores musculares -->
  <rect width="400" height="300" fill="url(#bg-diclofenaco)"/>
  <circle cx="330" cy="70" r="85" fill="#fb923c" opacity="0.16"/>
  <circle cx="80" cy="230" r="100" fill="#ea580c" opacity="0.12"/>

  <!-- Caja de Diclofenaco -->
  <g filter="url(#sombras-d)">
    <rect x="45" y="60" width="220" height="150" rx="10" fill="url(#caja-d)" stroke="#fed7aa" stroke-width="2"/>
    <path d="M 45 70 Q 45 60 55 60 L 255 60 Q 265 60 265 70 L 265 100 L 45 100 Z" fill="#ea580c"/>
    <text x="65" y="87" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">FARMACIA CONDORI</text>
    
    <text x="65" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#0f172a">DICLOFENACO</text>
    <text x="65" y="162" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ea580c">50 mg • Gel &amp; Comprimidos</text>
    <text x="65" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Antiinflamatorio y dolor muscular</text>

    <!-- Onda muscular -->
    <path d="M 65 198 Q 75 190 85 198 T 105 198 T 125 198" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  </g>

  <!-- Tubo de Gel Diclofenaco inclinado al frente -->
  <g filter="url(#sombras-d)" transform="rotate(-15 260 170)">
    <!-- Tapa del tubo -->
    <rect x="180" y="165" width="22" height="35" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="184" y1="168" x2="184" y2="197" stroke="#cbd5e1"/>
    <line x1="190" y1="168" x2="190" y2="197" stroke="#cbd5e1"/>
    <line x1="196" y1="168" x2="196" y2="197" stroke="#cbd5e1"/>

    <!-- Cuerpo del tubo -->
    <path d="M 202 172 L 315 162 L 320 203 L 202 193 Z" fill="url(#tubo-gel)"/>
    <!-- Extremo sellado -->
    <rect x="315" y="161" width="10" height="43" fill="#9a3412"/>

    <text x="215" y="184" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">GEL TÓPICO</text>
    <text x="215" y="194" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" fill="#ffedd5">Alivio inmediato</text>
  </g>
</svg>
