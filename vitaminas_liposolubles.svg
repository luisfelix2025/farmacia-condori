<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-lipo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="caja-lipo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="softgel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="sombras-lipo" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg-lipo)"/>
  <circle cx="340" cy="70" r="90" fill="#fde68a" opacity="0.3"/>
  <circle cx="70" cy="230" r="100" fill="#d97706" opacity="0.12"/>

  <!-- Caja de Vitaminas Liposolubles -->
  <g filter="url(#sombras-lipo)">
    <rect x="45" y="65" width="215" height="155" rx="10" fill="url(#caja-lipo)" stroke="#fde68a" stroke-width="2"/>
    <path d="M 45 75 Q 45 65 55 65 L 250 65 Q 260 65 260 75 L 260 105 L 45 105 Z" fill="#d97706"/>
    <text x="65" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">FARMACIA CONDORI</text>

    <text x="65" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#0f172a">VITAMINAS</text>
    <text x="65" y="162" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#d97706">Liposolubles (A, D, E, K)</text>
    <text x="65" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Cápsulas blandas de absorción lenta</text>

    <!-- Indicador cápsulas de gel -->
    <rect x="65" y="200" width="85" height="14" rx="3" fill="#fef3c7"/>
    <text x="70" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#b45309">SOFTGELS ORO</text>
  </g>

  <!-- Cápsulas blandas doradas traslúcidas (Softgels) -->
  <g filter="url(#sombras-lipo)">
    <!-- Frasco ámbar translúcido detrás -->
    <rect x="255" y="115" width="60" height="90" rx="10" fill="#78350f" opacity="0.75"/>
    <rect x="268" y="100" width="34" height="17" rx="3" fill="#ffffff" stroke="#cbd5e1"/>

    <!-- Cápsula Softgel 1 -->
    <ellipse cx="280" cy="180" rx="20" ry="12" fill="url(#softgel)" transform="rotate(-30 280 180)"/>
    <ellipse cx="276" cy="177" rx="6" ry="2" fill="#ffffff" opacity="0.7" transform="rotate(-30 280 180)"/>

    <!-- Cápsula Softgel 2 -->
    <ellipse cx="325" cy="165" rx="22" ry="13" fill="url(#softgel)" transform="rotate(25 325 165)"/>
    <ellipse cx="321" cy="161" rx="7" ry="3" fill="#ffffff" opacity="0.7" transform="rotate(25 325 165)"/>

    <!-- Cápsula Softgel 3 -->
    <ellipse cx="305" cy="210" rx="21" ry="12" fill="url(#softgel)" transform="rotate(10 305 210)"/>
    <ellipse cx="301" cy="207" rx="6" ry="2" fill="#ffffff" opacity="0.7" transform="rotate(10 305 210)"/>
  </g>
</svg>
