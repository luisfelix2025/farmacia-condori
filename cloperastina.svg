<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-clop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="caja-clop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="sombras-clop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg-clop)"/>
  <circle cx="340" cy="70" r="90" fill="#60a5fa" opacity="0.2"/>
  <circle cx="70" cy="230" r="100" fill="#2563eb" opacity="0.12"/>

  <!-- Caja de Cloperastina -->
  <g filter="url(#sombras-clop)">
    <rect x="50" y="65" width="200" height="155" rx="10" fill="url(#caja-clop)" stroke="#bfdbfe" stroke-width="2"/>
    <path d="M 50 75 Q 50 65 60 65 L 240 65 Q 250 65 250 75 L 250 105 L 50 105 Z" fill="#2563eb"/>
    <text x="70" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">FARMACIA CONDORI</text>

    <text x="70" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0f172a">CLOPERASTINA</text>
    <text x="70" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">3.54 mg/ml • Jarabe</text>
    <text x="70" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Calmante para la tos seca e irritativa</text>

    <rect x="70" y="202" width="75" height="12" rx="3" fill="#dbeafe"/>
    <text x="75" y="211" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#1d4ed8">ANTITUSÍGENO</text>
  </g>

  <!-- Botella y Cucharita dosificadora -->
  <g filter="url(#sombras-clop)">
    <!-- Botella -->
    <rect x="250" y="105" width="70" height="135" rx="14" fill="#1e3a5f" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="268" y="88" width="34" height="20" rx="3" fill="#1e3a5f"/>
    <rect x="265" y="73" width="40" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Etiqueta -->
    <rect x="252" y="130" width="66" height="85" fill="#ffffff"/>
    <rect x="252" y="130" width="66" height="14" fill="#2563eb"/>
    <text x="255" y="141" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="bold" fill="#ffffff">CLOPERASTINA</text>
    <text x="257" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">Tos Seca</text>
    <text x="257" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" fill="#64748b">200 ml</text>

    <!-- Cucharita dosificadora médica -->
    <g transform="translate(325, 175) rotate(15)">
      <ellipse cx="25" cy="15" rx="18" ry="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <ellipse cx="25" cy="15" rx="13" ry="8" fill="#3b82f6" opacity="0.6"/>
      <path d="M 12 18 L -15 45 L -11 49 L 16 22 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>
  </g>
</svg>
