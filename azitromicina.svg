<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-azitro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="caja-az" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="sombras-az" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg-azitro)"/>
  <circle cx="330" cy="70" r="90" fill="#2dd4bf" opacity="0.2"/>
  <circle cx="70" cy="230" r="100" fill="#0d9488" opacity="0.12"/>

  <!-- Caja de Azitromicina -->
  <g filter="url(#sombras-az)">
    <rect x="50" y="65" width="210" height="155" rx="10" fill="url(#caja-az)" stroke="#99f6e4" stroke-width="2"/>
    <path d="M 50 75 Q 50 65 60 65 L 250 65 Q 260 65 260 75 L 260 105 L 50 105 Z" fill="#0d9488"/>
    <text x="70" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">FARMACIA CONDORI</text>

    <text x="70" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#0f172a">AZITROMICINA</text>
    <text x="70" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0d9488">500 mg • 3 Tabletas</text>
    <text x="70" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Infecciones respiratorias agudas</text>

    <rect x="70" y="202" width="95" height="12" rx="3" fill="#ccfbf1"/>
    <text x="75" y="211" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#0f766e">TRATAMIENTO 3 DÍAS</text>
  </g>

  <!-- Blister de 3 tabletas oblongas grandes (típico de Azitromicina) -->
  <g filter="url(#sombras-az)">
    <rect x="235" y="115" width="125" height="120" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="245" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#64748b">AZITROMICINA 500mg</text>

    <!-- Tableta 1 -->
    <rect x="250" y="142" width="95" height="20" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <line x1="297" y1="144" x2="297" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Tableta 2 -->
    <rect x="250" y="172" width="95" height="20" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <line x1="297" y1="174" x2="297" y2="190" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Tableta 3 -->
    <rect x="250" y="202" width="95" height="20" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <line x1="297" y1="204" x2="297" y2="220" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
</svg>
